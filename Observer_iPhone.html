<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Observer">
<meta name="format-detection" content="telephone=no">
<title>Observer — глубокий разбор Dota 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101c23; --panel:#172730; --raised:#1f3540; --line:#2b434f;
  --text:#e6eef0; --muted:#93a9b2;
  --rad:#86d17a; --dire:#ff7059; --gold:#f0c05a; --ice:#6cc4e8;
  --r:10px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 'Golos Text',system-ui,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--ice);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:'Unbounded','Golos Text',sans-serif;font-weight:500;margin:0;line-height:1.25}
h2{font-size:17px;margin-bottom:14px}
h3{font-size:14px;margin-bottom:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
main{padding:20px 0 60px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(16,28,35,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;color:var(--text)}
.brand:hover{text-decoration:none;color:var(--gold)}
.sform{display:flex;gap:8px;flex:1;min-width:240px;max-width:560px}
.sform input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.sform input::placeholder{color:var(--muted)}
.btn{background:var(--gold);color:#241a02;border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px}

/* layout blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.win{color:var(--rad)} .loss{color:var(--dire)}
.err{border-color:var(--dire)}
.notice{background:var(--raised);border:1px solid var(--gold);border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.notice p{margin:0 0 10px}

/* home */
.hero{padding:56px 0 30px;max-width:760px}
.hero h1{font-size:clamp(26px,4.6vw,44px);margin-bottom:14px}
.hero p{color:var(--muted);font-size:17px;margin:0 0 26px;max-width:620px}
.hero .sform{max-width:none}
.hero .sform input{padding:15px 16px;font-size:17px}
.hero .btn{padding:0 24px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;color:var(--text)}
.chip img{width:26px;height:26px;border-radius:50%}
.howto{max-width:760px}
.howto ul{margin:0;padding-left:20px;color:var(--muted)}
.howto li{margin-bottom:6px}

/* player header */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.phead img.av{width:80px;height:80px;border-radius:12px;background:var(--raised)}
.phead h1{font-size:24px}
.rank{display:inline-block;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-weight:500;color:var(--gold)}
.stats{display:flex;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--line)}
.stat{flex:1 1 150px;padding:14px 16px 0 0}
.stat b{display:block;font-family:'Unbounded',sans-serif;font-weight:500;font-size:20px}
.stat span{color:var(--muted);font-size:13px}

/* tables */
.scroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-weight:500;color:var(--muted);font-size:13px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.me td{background:rgba(240,192,90,.07)}
.tbl .num{text-align:right}
.hc{display:flex;align-items:center;gap:10px}
.hc img{width:48px;height:27px;border-radius:3px;object-fit:cover;background:var(--raised)}
.it{width:32px;height:24px;border-radius:3px;object-fit:cover;background:var(--raised);margin-right:2px;vertical-align:middle}
.it.empty{display:inline-block}
.tot td{font-weight:500;color:var(--muted)}

/* form strip */
.strip{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:14px}
.strip a{width:14px;height:22px;border-radius:3px;display:block}
.strip a.w{background:var(--rad)} .strip a.l{background:var(--dire)}
.bar{height:6px;background:var(--raised);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--rad)}
.rec{list-style:none;margin:0;padding:0}
.rec li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rec li:last-child{border-bottom:0}

/* match */
.mhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.mscore{display:flex;align-items:center;gap:18px;font-family:'Unbounded',sans-serif;font-size:32px}
.mscore .r{color:var(--rad)} .mscore .d{color:var(--dire)}
.mscore small{font-family:'Golos Text',sans-serif;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.tabs button[aria-selected=true]{background:var(--gold);color:#241a02;border-color:var(--gold);font-weight:700}
.tname{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:'Unbounded',sans-serif;font-size:14px}
.tname.rad{color:var(--rad)} .tname.dire{color:var(--dire)}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700;background:var(--raised)}
.g-S{background:var(--gold);color:#241a02}
.g-A{background:var(--rad);color:#10240c}
.g-B{background:var(--ice);color:#06222e}
.g-C{background:#5d7480;color:#fff}
.g-D{background:var(--dire);color:#2b0a04}
.mvp{font-size:12px;background:var(--gold);color:#241a02;border-radius:4px;padding:0 5px;margin-left:6px;font-weight:700}
.hl{margin:0;padding-left:18px}
.hl li{margin-bottom:6px}

/* charts */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;top:6px;z-index:5;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;pointer-events:none;min-width:150px}
.tip div{display:flex;justify-content:space-between;gap:14px;white-space:nowrap}
.tip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.legend button{display:flex;align-items:center;gap:6px;background:var(--raised);border:2px solid var(--line);border-radius:8px;padding:3px 8px 3px 4px;font-size:13px}
.legend button[aria-pressed=false]{opacity:.35}
.legend img{width:36px;height:20px;border-radius:3px;object-fit:cover}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 8px 8px 0}
.seg button{background:var(--panel);border:0;padding:6px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--gold);font-weight:700}

/* wards */
.wardgrid{display:grid;grid-template-columns:minmax(0,600px) 1fr;gap:18px;align-items:start}
@media(max-width:900px){.wardgrid{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px}
.ctrl{display:flex;flex-direction:column;gap:12px}
.ctrl label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:13px}
.ctrl select,.ctrl input[type=text]{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.ctrl input[type=range]{width:100%;accent-color:var(--gold)}
.time-range{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time-range label{gap:5px}
.time-range b{font-size:14px;color:var(--gold)}
@media(max-width:560px){.time-range{grid-template-columns:1fr}}
.ctrl .chk{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.wlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}

/* chat */
.chatbox{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.msg{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.msg:last-child{border-bottom:0}
.msg time{color:var(--muted);min-width:46px}
.msg .rad{color:var(--rad)} .msg .dire{color:var(--dire)}
.wheel{color:var(--muted);font-style:italic}

/* rating */
.rrow{display:grid;grid-template-columns:230px 60px 1fr 260px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
@media(max-width:900px){.rrow{grid-template-columns:1fr 60px}.rrow .notes,.rrow .bars{grid-column:1/-1}}
.grade{font-family:'Unbounded',sans-serif;font-size:22px;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:700}
.notes p{margin:0 0 4px;font-size:14px}
.mbar{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.mbar div{position:relative;height:6px;background:var(--raised);border-radius:3px}
.mbar b{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--ice)}
.mbar div::after{content:"";position:absolute;left:50%;top:-2px;height:10px;width:1px;background:var(--muted)}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}

/* Observer analytics */
.role-badge{display:inline-block;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:2px 7px;font-size:12px;color:var(--gold);margin-left:4px}
.rating-plus{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700}.rating-plus.pos{color:var(--rad)}.rating-plus.neg{color:var(--dire)}
.conf{font-size:11px;color:var(--muted);margin-left:5px}
.minute-panel{position:sticky;top:70px;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.minute-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.minute-big{font-family:'Unbounded';font-size:24px;color:var(--gold)}
.minute-grid{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center}.minute-grid input{width:100%;accent-color:var(--gold)}
.mini-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.mini-card{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:9px}.mini-card b{display:block;font-size:16px}.mini-card span{font-size:11px;color:var(--muted)}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.feature{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:11px}.feature b{display:block;margin-bottom:3px}.feature p{margin:0;color:var(--muted);font-size:12px}
.rating-controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.rating-controls select,.rating-controls input{background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.radar{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center}.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--pct),var(--raised) 0);position:relative}.score-ring:after{content:'';position:absolute;inset:12px;background:var(--panel);border-radius:50%}.score-ring strong{position:relative;z-index:1;font-family:'Unbounded';font-size:22px}
@media(max-width:800px){.feature-grid{grid-template-columns:1fr}.mini-cards{grid-template-columns:repeat(2,1fr)}.minute-grid{grid-template-columns:1fr}.radar{grid-template-columns:1fr}}

/* Observer iPhone edition */
html{background:#0b1014;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
button,select,input{font:inherit}
button{min-height:42px;-webkit-user-select:none;user-select:none}
input[type="range"]{width:100%;height:44px;min-height:44px;accent-color:var(--gold);touch-action:pan-x;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{width:28px;height:28px}
input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:99px}
.tabs{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;padding:2px 2px 8px;margin:0 -2px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;min-height:44px;padding:10px 15px}
.scroll{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tbl{font-size:13px}
.tbl th,.tbl td{padding:9px 8px}
select{min-height:44px;max-width:100%;padding:8px 32px 8px 10px}
label{min-width:0}
.map{width:100%;height:auto;min-height:280px;touch-action:pan-x pan-y;display:block}
.wardgrid{grid-template-columns:minmax(0,1.45fr) minmax(250px,.8fr)}
.time-range{gap:14px}
.time-range label{min-width:0}
.minute-grid input[type="range"]{margin:3px 0}
.rating-controls select{width:100%;max-width:360px}
.grid2{gap:12px}
@media(max-width:700px){
  body{font-size:15px}
  .wrap{width:100%;padding:12px 12px 28px}
  header{padding-top:calc(10px + env(safe-area-inset-top))}
  header .head{gap:10px}
  .brand{font-size:21px}
  .sub{font-size:11px}
  .panel{padding:14px;margin-bottom:12px}
  .panel h2{font-size:18px}
  .panel h3{font-size:15px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feature-grid{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .wardgrid{grid-template-columns:1fr}
  .wardgrid .map{order:0}
  .wardgrid .ctrl{order:1}
  .time-range{grid-template-columns:1fr}
  .rrow{grid-template-columns:1fr auto}
  .rrow .bars{grid-column:1/-1}
  .rrow .notes{grid-column:1/-1}
  .rating-plus{font-size:25px}
  .chart{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chart svg{min-width:620px}
  .legend{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .legend button{flex:0 0 auto}
  .hero-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:100%}
}
@media(max-width:420px){
  .wrap{padding-left:9px;padding-right:9px}
  .feature-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .panel{padding:12px}
  .tbl{font-size:12px}
  .tbl th,.tbl td{padding:8px 7px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">Observer</a>
    <form class="sform" id="hform" role="search">
      <input id="hq" type="search" placeholder="Ник, ID игрока или ссылка на матч" aria-label="Поиск игрока или матча" autocomplete="off">
      <button class="btn" type="submit">Найти</button>
    </form>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">Данные берутся из OpenDota API. Observer не связан с Valve. Все аналитические функции бесплатны; оценки являются аналитической моделью, а не официальным рейтингом.</div></footer>

<script>
'use strict';
/* ========== базовые вещи ========== */
const API = 'https://api.opendota.com/api';
const IMG = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app');
const cache = new Map();
let HEROES = {}, ITEMS = {}, metaP = null, nav = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = s => { const neg = s < 0; s = Math.abs(Math.round(s)); return (neg ? '-' : '') + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtK = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
const dateRu = ts => new Date(ts * 1000).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
function ago(ts) {
  const d = Date.now() / 1000 - ts;
  if (d < 3600) return Math.max(1, Math.round(d / 60)) + ' мин назад';
  if (d < 86400) return Math.round(d / 3600) + ' ч назад';
  if (d < 86400 * 30) return Math.round(d / 86400) + ' дн назад';
  return dateRu(ts);
}
const MEDALS = ['', 'Рекрут', 'Страж', 'Рыцарь', 'Герой', 'Легенда', 'Властитель', 'Божество', 'Титан'];
function rankText(t, lb) {
  if (!t) return 'Без ранга';
  const m = Math.floor(t / 10), s = t % 10;
  if (m >= 8) return lb ? `Титан, топ ${lb}` : 'Титан';
  return `${MEDALS[m]} ${s}`;
}
const MODES = {1:'All Pick',2:"Captain's Mode",3:'Random Draft',4:'Single Draft',5:'All Random',12:'Least Played',16:'Captain Draft',18:'Ability Draft',22:'All Pick',23:'Turbo'};
const won = m => (m.player_slot < 128) === m.radiant_win;
/* Картинка миникарты грузится из интернета при каждом открытии, поэтому следует за обновлениями источника.
   Адреса перебираются по порядку, первый рабочий побеждает. Если ни один не открылся, рисуется схема. */
let MEM_MAP = '';
const MAP_URLS = [
  'https://www.opendota.com/assets/images/dota2/map/detailed_688.jpeg',
  'https://raw.githubusercontent.com/odota/ui/master/public/assets/images/dota2/map/detailed_688.jpeg'
];

/* автозапрос разбора рейтинговых игр */
const REQ_KEY = 'zames_parse_req';
function reqMap() { try { return JSON.parse(localStorage.getItem(REQ_KEY) || '{}'); } catch (e) { return {}; } }
const wasRequested = id => { const t = reqMap()[id]; return !!t && Date.now() - t < 6 * 3600e3; };
function markRequested(id) {
  try {
    const m = reqMap(); m[id] = Date.now();
    const o = {}; Object.keys(m).sort((a, b) => m[b] - m[a]).slice(0, 200).forEach(k => { o[k] = m[k]; });
    localStorage.setItem(REQ_KEY, JSON.stringify(o));
  } catch (e) {}
}
async function requestParse(id) {
  const r = await fetch(`${API}/request/${id}`, { method: 'POST' });
  if (r.status === 429) throw new Error('limit');
  if (!r.ok) throw new Error('http ' + r.status);
  markRequested(id);
}

async function api(path, opts) {
  if (!opts && cache.has(path)) return cache.get(path);
  let r;
  try { r = await fetch(API + path, opts); }
  catch (e) {
    const framed = window.self !== window.top;
    throw new Error('Запрос к api.opendota.com заблокирован или не дошёл (' + (e && e.message || 'network error') + '). ' +
      (framed ? 'Сайт открыт внутри встроенного окна, где внешние запросы запрещены: скачай zames.html и открой его в обычной вкладке браузера. ' : '') +
      'Также проверь, что адрес https://api.opendota.com/api/heroes открывается в браузере, и отключи блокировщики рекламы или VPN для этой страницы.');
  }
  if (r.status === 429) throw new Error('OpenDota просит подождать: лимит 60 запросов в минуту. Попробуй через минуту.');

function go(q) {
  q = q.trim(); if (!q) return;
  let m = q.match(/(?:players?|matches|match)\/(\d+)/i);
  if (m) { location.hash = (/match/i.test(q) ? '#/match/' : '#/player/') + m[1]; return; }
  if (/^m\d+$/i.test(q)) { location.hash = '#/match/' + q.slice(1); return; }
  if (/^\d{16,}$/.test(q)) { location.hash = '#/player/' + (BigInt(q) - 76561197960265728n).toString(); return; }
  if (/^\d+$/.test(q)) { location.hash = '#/player/' + q; return; }

let chartUid = 0;
function lineChart(el, o) {
  const uid = 'c' + (++chartUid);
  const W = 900, H = o.height || 300, pl = 54, pr = 16, pt = 14, pb = 30;
  const series = o.series;
  const n = Math.max(2, ...series.map(s => s.data.length));
  function draw() {
    const vis = series.filter(s => s.on !== false);
    let mn = o.min ?? Infinity, mx = o.max ?? -Infinity;
    vis.forEach(s => s.data.forEach(v => { if (v == null) return; if (o.min == null && v < mn) mn = v; if (o.max == null && v > mx) mx = v; }));
    if (!isFinite(mn)) mn = 0;
    if (!isFinite(mx)) mx = 1;
    if (o.zero) { mn = Math.min(mn, 0); mx = Math.max(mx, 0); }
    if (mx === mn) mx = mn + 1;
    const X = i => pl + (W - pl - pr) * i / (n - 1);
    const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
    let g = '';
    for (let k = 0; k <= 4; k++) {
      const v = mn + (mx - mn) * k / 4, y = Y(v);
      g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#2b434f"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" fill="#93a9b2" font-size="12">${o.yFmt ? o.yFmt(v) : Math.round(v)}</text>`;
    }
    const step = n > 60 ? 10 : n > 25 ? 5 : n > 12 ? 2 : 1;
    for (let i = 0; i < n; i += step) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" fill="#93a9b2" font-size="12">${o.xFmt ? o.xFmt(i) : i}</text>`;
    if (o.zero) { const y = Y(0); g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="#93a9b2" stroke-dasharray="4 4"/>`; }
    if (o.area && vis[0]) {
      const s = vis[0], y0 = Y(0);
      const d = `M${s.data.map((v, i) => X(i) + ',' + Y(v)).join(' L')} L${X(s.data.length - 1)},${y0} L${X(0)},${y0}Z`;
      g += `<clipPath id="${uid}u"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="${uid}d"><rect x="0" y="${y0}" width="${W}" height="${Math.max(0, H - y0)}"/></clipPath>` +
           `<path d="${d}" fill="${o.areaUp}" opacity=".5" clip-path="url(#${uid}u)"/><path d="${d}" fill="${o.areaDown}" opacity=".5" clip-path="url(#${uid}d)"/>`;
    }
    vis.forEach(s => {
      const pts = s.data.map((v, i) => v == null ? null : X(i) + ',' + Y(v)).filter(Boolean);
      if (pts.length) g += `<path d="M${pts.join(' L')}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round"/>`;
    });
    el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'График')}">${g}<line class="cur" y1="${pt}" y2="${H - pb}" stroke="#e6eef0" stroke-opacity=".5" style="display:none"/><rect class="hit" x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" fill="transparent"/></svg><div class="tip" hidden></div></div>`;
    const svg = $('svg', el), hit = $('.hit', svg), cur = $('.cur', svg), tip = $('.tip', el);
    hit.addEventListener('pointermove', ev => {
      const r = svg.getBoundingClientRect();
      const sx = (ev.clientX - r.left) / r.width * W;
      let i = Math.round((sx - pl) / (W - pl - pr) * (n - 1));
      i = Math.max(0, Math.min(n - 1, i));
      const x = X(i);
      cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.style.display = '';
      tip.innerHTML = o.tip ? o.tip(i, vis) : defaultTip(i, vis);
      tip.hidden = false;
      let left = x / W * r.width + 12;
      if (left + tip.offsetWidth > r.width - 4) left = x / W * r.width - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, left) + 'px';
    });
    hit.addEventListener('pointerleave', () => { cur.style.display = 'none'; tip.hidden = true; });
  }
  function defaultTip(i, vis) {
    const rows = vis.filter(s => s.data[i] != null).sort((a, b) => b.data[i] - a.data[i]);
    return `<b>${o.xFmt ? o.xFmt(i) : i}</b>` + rows.map(s => `<div><span><i style="background:${s.color}"></i>${esc(s.label)}</span><span>${o.yFmt ? o.yFmt(s.data[i]) : Math.round(s.data[i])}</span></div>`).join('');
  }
  draw();
  return { redraw: draw };
}

  2:{farm:.20,xp:.16,fight:.18,damage:.22,objective:.09,vision:.02,survival:.07,tempo:.06},
  3:{farm:.14,xp:.12,fight:.22,damage:.14,objective:.16,vision:.04,survival:.10,tempo:.08},
  4:{farm:.06,xp:.08,fight:.22,damage:.10,objective:.13,vision:.25,survival:.07,tempo:.09},

  s[2]+=Math.min(46,Math.max(0,(f.xshare-.78)*55))+Math.min(28,Math.max(0,(f.gshare-.72)*38))+Math.min(8,Math.max(0,(f.lhshare-.70)*15));

/* ========== страница игрока ========== */
async function playerPage(id) {
  if (!/^\d+$/.test(id || '')) throw new Error('Неверный ID игрока.');
  await meta();
  const [p, wl, ms, hs, peers] = await Promise.all([
    api(`/players/${id}`), api(`/players/${id}/wl`), api(`/players/${id}/matches?limit=100`),
    api(`/players/${id}/heroes`), api(`/players/${id}/peers`).catch(() => [])
  ]);
  if (!p || !p.profile) throw new Error('Профиль не найден. Проверь ID.');
  ms.forEach(m => { m.won = won(m); });
  const name = p.profile.personaname || 'Аноним';
  addRecent({ id, name, avatar: p.profile.avatarfull });

  const n = ms.length, chrono = [...ms].reverse();
  const sk = ms.reduce((s, m) => s + m.kills, 0), sd = ms.reduce((s, m) => s + m.deaths, 0), sa = ms.reduce((s, m) => s + m.assists, 0);
  let cur = 0, curWin = null;
  if (n) { curWin = ms[0].won; for (const m of ms) { if (m.won === curWin) cur++; else break; } }
  let best = 0, run = 0;
  chrono.forEach(m => { run = m.won ? run + 1 : 0; best = Math.max(best, run); });
  const wr = wl.win + wl.lose ? Math.round(wl.win / (wl.win + wl.lose) * 100) : 0;
  const mmr = p.mmr_estimate?.estimate;

  const win = Math.min(10, chrono.length);
  const roll = chrono.map((_, i) => { const s = chrono.slice(Math.max(0, i - win + 1), i + 1); return s.filter(m => m.won).length / s.length * 100; });

  const topHeroes = [...hs].filter(h => h.games > 0).slice(0, 10);
  const ranked = hs.filter(h => h.games >= 5).map(h => ({ ...h, wr: h.win / h.games })).sort((a, b) => b.wr - a.wr);
  const bestH = ranked.slice(0, 3), worstH = ranked.length > 6 ? ranked.slice(-3).reverse() : [];
  const heroLine = h => `<li><a class="hc" href="#/player/${id}"><span class="hc">${hImg(h.hero_id)}${esc(hName(h.hero_id))}</span></a><span>${Math.round(h.wr * 100)}% <span class="muted">(${h.games} игр)</span></span></li>`;

  const by = (f, dir = 1, arr = ms) => arr.length ? arr.reduce((a, m) => f(m) * dir > f(a) * dir ? m : a, arr[0]) : null;
  const recs = [];
  if (n) {
    const add = (label, m, val) => m && recs.push(`<li><span>${label}</span><a href="#/match/${m.match_id}">${val}, ${esc(hName(m.hero_id))}</a></li>`);
    const mk = by(m => m.kills); add('Больше всего убийств', mk, mk.kills);
    const ma = by(m => m.assists); add('Больше всего помощи', ma, ma.assists);
    const mkda = by(m => (m.kills + m.assists) / Math.max(1, m.deaths)); add('Лучший KDA', mkda, `${mkda.kills}/${mkda.deaths}/${mkda.assists}`);
    const md = by(m => m.deaths); add('Больше всего смертей', md, md.deaths);
    const ml = by(m => m.duration); add('Самая долгая игра', ml, mmss(ml.duration));
    const wins = ms.filter(m => m.won); const mf = by(m => m.duration, -1, wins); add('Самая быстрая победа', mf, mmss(mf?.duration || 0));
  }

  const rowHtml = m => `<tr>
    <td><a class="hc" href="#/match/${m.match_id}">${hImg(m.hero_id)}${esc(hName(m.hero_id))}</a></td>
    <td class="${m.won ? 'win' : 'loss'}">${m.won ? 'Победа' : 'Поражение'}</td>
    <td>${m.kills}/${m.deaths}/${m.assists}</td>
    <td class="num">${((m.kills + m.assists) / Math.max(1, m.deaths)).toFixed(2)}</td>
    <td>${mmss(m.duration)}</td>
    <td>${m.lobby_type === 7 ? 'Рейтинг' + (m.version == null ? ' <span class="muted" title="Матч ещё не разобран OpenDota">(без разбора)</span>' : '') : (MODES[m.game_mode] || 'Другое')}</td>
    <td class="muted">${m.average_rank ? rankText(m.average_rank) : ''}</td>
    <td class="muted">${ago(m.start_time)}</td></tr>`;
  const PAGE = 25;

  const html = `
  <div class="panel">
    <div class="phead">
      <img class="av" src="${esc(p.profile.avatarfull)}" alt="">
      <div>
        <h1>${esc(name)}</h1>
        <p style="margin:6px 0 0"><span class="rank">${esc(rankText(p.rank_tier, p.leaderboard_rank))}</span>
        ${mmr ? `<span class="muted"> примерно ${mmr} MMR</span>` : ''}
        <a href="https://www.opendota.com/players/${id}" target="_blank" rel="noopener" style="margin-left:10px">профиль на OpenDota</a></p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b>${wl.win} / ${wl.lose}</b><span>победы и поражения, винрейт ${wr}%</span></div>
      <div class="stat"><b>${n ? ((sk + sa) / Math.max(1, sd)).toFixed(2) : '-'}</b><span>KDA за последние ${n} игр</span></div>
      <div class="stat"><b>${n ? (sk / n).toFixed(1) + ' / ' + (sd / n).toFixed(1) + ' / ' + (sa / n).toFixed(1) : '-'}</b><span>средние убийства, смерти, помощь</span></div>
      <div class="stat"><b>${n ? mmss(ms.reduce((s, m) => s + m.duration, 0) / n) : '-'}</b><span>средняя длительность</span></div>
      <div class="stat"><b class="${curWin ? 'win' : 'loss'}">${n ? cur + (curWin ? ' побед' : ' поражений') : '-'}</b><span>текущая серия, лучшая серия побед: ${best}</span></div>
    </div>
  </div>
  ${n ? `
  <div class="grid2">
    <div class="panel">
      <h2>Самые частые герои</h2>
      <div class="scroll"><table class="tbl" style="min-width:420px"><thead><tr><th>Герой</th><th class="num">Игры</th><th class="num">Винрейт</th><th></th></tr></thead><tbody>
      ${topHeroes.map(h => { const w = Math.round(h.win / h.games * 100); return `<tr><td><span class="hc">${hImg(h.hero_id)}${esc(hName(h.hero_id))}</span></td><td class="num">${h.games}</td><td class="num ${w >= 50 ? 'win' : 'loss'}">${w}%</td><td><div class="bar"><i style="width:${w}%"></i></div></td></tr>`; }).join('')}
      </tbody></table></div>
    </div>
    <div>
      ${bestH.length ? `<div class="panel"><h2>Лучшие герои по винрейту</h2><ul class="rec">${bestH.map(heroLine).join('')}</ul><p class="muted" style="margin:10px 0 0;font-size:13px">Только герои, на которых сыграно 5 игр и больше.</p></div>` : ''}
      ${worstH.length ? `<div class="panel"><h2>Герои, которые не заходят</h2><ul class="rec">${worstH.map(heroLine).join('')}</ul></div>` : ''}
    </div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>Рекорды за последние ${n} игр</h2><ul class="rec">${recs.join('')}</ul></div>
    <div class="panel"><h2>Частые напарники</h2>
      ${peers.length ? `<ul class="rec">${[...peers].sort((a, b) => b.with_games - a.with_games).slice(0, 6).map(x => `<li><a class="hc" href="#/player/${x.account_id}"><img style="width:32px;height:32px;border-radius:50%" src="${esc(x.avatar)}" alt="">${esc(x.personaname || 'Аноним')}</a><span>${x.with_games} игр вместе, ${Math.round(x.with_win / Math.max(1, x.with_games) * 100)}% побед</span></li>`).join('')}</ul>` : '<p class="muted">Нет данных.</p>'}
    </div>
  </div>
  <div class="panel">
    <h2>Герои — сколько игр</h2>
    <div class="scroll"><table class="tbl" style="min-width:520px"><thead><tr><th>Герой</th><th class="num">Игр</th><th class="num">Побед</th><th class="num">Поражений</th><th class="num">Винрейт</th></tr></thead><tbody>
    ${topHeroes.map(h=>{const w=h.win,l=h.games-w,wr=Math.round(w/Math.max(1,h.games)*100);return `<tr><td><span class="hc">${hImg(h.hero_id)}${esc(hName(h.hero_id))}</span></td><td class="num">${h.games}</td><td class="num win">${w}</td><td class="num loss">${l}</td><td class="num">${wr}%</td></tr>`}).join('')}
    </tbody></table></div>
  </div>
  <div class="panel">
    <h2>История игр</h2>
    <p id="parseStatus" class="muted" style="margin:-6px 0 12px"></p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Герой</th><th>Итог</th><th>У/С/П</th><th class="num">KDA</th><th>Время</th><th>Режим</th><th>Ср. ранг матча</th><th>Когда</th></tr></thead><tbody id="hist">${ms.slice(0, PAGE).map(rowHtml).join('')}</tbody></table></div>
    ${n > PAGE ? '<p style="margin:14px 0 0"><button class="btn ghost" id="more">Показать ещё</button></p>' : ''}
  </div>` : `<div class="panel notice"><p>История матчей скрыта. В Dota 2 включи «Выставлять публичные данные матчей» и сыграй ещё одну игру.</p></div>`}`;

  return { html, mount() {
    let shown = PAGE;
    const more = $('#more');
    if (more) more.onclick = () => {
      $('#hist').insertAdjacentHTML('beforeend', ms.slice(shown, shown + PAGE).map(rowHtml).join(''));
      shown += PAGE; if (shown >= n) more.remove();
    };
    /* авто-разбор: рейтинговые матчи без разбора, не больше 15 за раз */
    const st = $('#parseStatus');
    const queue = ms.filter(m => m.lobby_type === 7 && m.version == null && !wasRequested(m.match_id)).slice(0, 15).map(m => m.match_id);
    const pending = ms.filter(m => m.lobby_type === 7 && m.version == null).length;
    if (st && pending && !queue.length) st.textContent = `Разбор уже запрошен для рейтинговых игр (${pending}). Обнови страницу через несколько минут.`;
    if (st && queue.length) {
      const myNav = nav;
      (async () => {
        let done = 0;
        for (const id of queue) {
          if (myNav !== nav) return;
          st.textContent = `Запрашиваю разбор рейтинговых игр: ${done} из ${queue.length}…`;
          try { await requestParse(id); done++; }
          catch (e) { st.textContent = e.message === 'limit' ? `Лимит запросов OpenDota. Запрошено ${done} из ${queue.length}, остальное продолжится при следующем заходе.` : `Разбор запрошен для ${done} игр, дальше OpenDota не отвечает.`; return; }
          await new Promise(r => setTimeout(r, 1500));
        }
        if (myNav === nav) st.textContent = `Разбор запрошен для ${done} рейтинговых игр. Обычно он занимает от одной до нескольких минут, потом обнови страницу.`;
      })();
    }
  } };
}

/* ========== страница матча ========== */
const PCOL = { rad: ['#7ddc6a', '#2fb59a', '#b8e550', '#58d0e8', '#a3d9a5'], dire: ['#ff6a4d', '#ff9f43', '#ff5d8f', '#e6c229', '#c97bff'] };
function colorize(m) {
  let a = 0, b = 0;
  m.players.forEach(p => { p._rad = p.player_slot < 128; p._color = p._rad ? PCOL.rad[a++ % 5] : PCOL.dire[b++ % 5]; });
}
const pName = p => esc(p.name || p.personaname || 'Аноним');
const isParsed = m => !!(m.players[0].gold_t && m.players[0].gold_t.length);
const netWorth = p => p.net_worth ?? (p.gold_t ? p.gold_t[p.gold_t.length - 1] : null);

function highlights(m) {
  const out = [], adv = m.radiant_gold_adv;
  if (adv && adv.length > 4) {
    const sign = m.radiant_win ? 1 : -1;
    const worst = Math.min(...adv.map(v => v * sign));
    if (worst < -3000) out.push(`Камбэк: победители отставали на ${fmtK(-worst)} золота (минута ${adv.findIndex(v => v * sign === worst)}).`);
    let bd = 0, bi = 3;
    for (let i = 3; i < adv.length; i++) { const d = adv[i] - adv[i - 3]; if (Math.abs(d) > Math.abs(bd)) { bd = d; bi = i; } }
    out.push(`Самый резкий перелом: за минуты ${bi - 3}–${bi} перевес Сил ${bd > 0 ? 'Света' : 'Тьмы'} вырос на ${fmtK(Math.abs(bd))} золота.`);
    const pk = adv.reduce((a, v) => Math.abs(v) > Math.abs(a) ? v : a, 0);
    out.push(`Максимальный перевес: ${fmtK(Math.abs(pk))} золота у Сил ${pk > 0 ? 'Света' : 'Тьмы'} на ${adv.indexOf(pk)}-й минуте.`);
  }
  const fb = (m.objectives || []).find(o => o.type === 'CHAT_MESSAGE_FIRSTBLOOD');
  if (fb) out.push(`Первая кровь на ${mmss(fb.time)}.`);
  const rosh = (m.objectives || []).filter(o => o.type === 'CHAT_MESSAGE_ROSHAN_KILL');
  if (rosh.length) out.push('Рошан: ' + rosh.map(o => `${mmss(o.time)} (${o.team === 2 ? 'Свет' : 'Тьма'})`).join(', ') + '.');
  return out;
}

async function matchPage(id) {
  if (!/^\d+$/.test(id || '')) throw new Error('Неверный номер матча.');
  await meta();
  const m = await api('/matches/' + id);
  if (!m || !m.players) throw new Error('Матч не найден.');
  colorize(m);
  const scores = scoreMatch(m);
  const parsed = isParsed(m);
  const rk = m.radiant_score ?? m.players.filter(p => p._rad).reduce((s, p) => s + p.kills, 0);
  const dk = m.dire_score ?? m.players.filter(p => !p._rad).reduce((s, p) => s + p.kills, 0);
  const hl = highlights(m);

  const teamTable = rad => {
    const rows = scores.filter(x => x.p._rad === rad);
    const sum = f => rows.reduce((s, x) => s + (f(x.p) || 0), 0);
    return `<div class="tname ${rad ? 'rad' : 'dire'}">${rad ? 'Силы Света' : 'Силы Тьмы'}${m.radiant_win === rad ? ' (победа)' : ''}</div>
    <div class="scroll" style="margin-bottom:18px"><table class="tbl" style="min-width:1000px"><thead><tr><th>Герой</th><th>Игрок</th><th class="num">Ур.</th><th>У/С/П</th><th class="num">Нетворс</th><th>GPM / XPM</th><th>LH / DN</th><th class="num">Урон</th><th class="num">Башни</th><th class="num">Лечение</th><th>Предметы</th><th>Оценка</th></tr></thead><tbody>
    ${rows.map(({ p, score, grade, mvp }) => `<tr>
      <td><span class="hc">${hImg(p.hero_id)}${esc(hName(p.hero_id))}</span></td>
      <td>${p.account_id ? `<a href="#/player/${p.account_id}">${pName(p)}</a>` : pName(p)}</td>
      <td class="num">${p.level ?? ''}</td>
      <td>${p.kills}/${p.deaths}/${p.assists}</td>
      <td class="num">${netWorth(p) != null ? fmtK(netWorth(p)) : '-'}</td>
      <td>${p.gold_per_min} / ${p.xp_per_min}</td>
      <td>${p.last_hits} / ${p.denies}</td>
      <td class="num">${fmtK(p.hero_damage || 0)}</td>
      <td class="num">${fmtK(p.tower_damage || 0)}</td>
      <td class="num">${fmtK(p.hero_healing || 0)}</td>
      <td>${[0, 1, 2, 3, 4, 5].map(i => itemImg(p['item_' + i])).join('')}${p.item_neutral ? itemImg(p.item_neutral) : ''}</td>
      <td><span class="score g-${grade}" title="${score.toFixed(0)} очков">${grade}</span>${mvp ? '<span class="mvp">MVP</span>' : ''}</td></tr>`).join('')}
    <tr class="tot"><td colspan="3">Итого</td><td>${sum(p => p.kills)}/${sum(p => p.deaths)}/${sum(p => p.assists)}</td><td class="num">${fmtK(sum(netWorth))}</td><td colspan="2"></td><td class="num">${fmtK(sum(p => p.hero_damage))}</td><td class="num">${fmtK(sum(p => p.tower_damage))}</td><td class="num">${fmtK(sum(p => p.hero_healing))}</td><td colspan="2"></td></tr>
    </tbody></table></div>`;
  };

  const notParsed = `<div class="notice"><p>Этот матч ещё не разобран OpenDota, поэтому здесь нет данных по минутам, вардам и чату.</p><button class="btn" id="reqparse">Запросить разбор</button></div>`;
  const TABS = [['overview','Обзор'],['graphs','Графики'],['rating','Оценка игроков'],['lanes','Линии'],['battles','Битвы'],['wards','Варды'],['runes','Руны'],['farm','Фарм'],['chat','Чат']];

  const html = `
  <div class="panel">
    <div class="mhead">
      <div>
        <h1>Матч ${m.match_id}</h1>
        <p class="muted" style="margin:6px 0 0">${dateRu(m.start_time)}, ${mmss(m.duration)}, ${m.lobby_type === 7 ? 'рейтинговый' : (MODES[m.game_mode] || 'обычный')}${m.game_mode ? ', ' + (MODES[m.game_mode] || '') : ''}</p>
        <p style="margin:6px 0 0" class="${m.radiant_win ? 'win' : 'loss'}"><b>Победа Сил ${m.radiant_win ? 'Света' : 'Тьмы'}</b></p>
      </div>
      <div class="mscore"><span class="r">${rk}</span><small>убийства</small><span class="d">${dk}</span></div>
    </div>
  </div>
  ${!parsed ? notParsed : ''}
  <div class="tabs" role="tablist">${TABS.map(([k, t], i) => `<button role="tab" data-tab="${k}" aria-selected="${i === 0}">${t}</button>`).join('')}</div>
  <div id="tabbox"></div>`;

  const TAB = {
    overview(box) {
      box.innerHTML = `<div class="panel">${teamTable(true)}${teamTable(false)}</div>` +
        (hl.length ? `<div class="panel"><h2>Ход игры</h2><ul class="hl">${hl.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '');
    },
    graphs(box) {
      if (!parsed) { box.innerHTML = '<div class="panel muted">Для графиков нужен разобранный матч.</div>'; return; }

      const rows=(m.chat||[]).filter(c=>c.type==='chat'||c.type==='chatwheel').map(c=>{const p=m.players.find(x=>x.player_slot===c.player_slot)||m.players[c.slot],k=Number(c.key);return{c,p,text:c.type==='chat'?String(c.key):(wheel[k]||`Chat Wheel #${k}`),wheel:c.type==='chatwheel'};});box.innerHTML=`<div class="panel"><h2>Лог чата (${rows.length})</h2><div class="chatbox" id="cbox"></div></div>`;if(!rows.length){$('#cbox',box).innerHTML='<p class="muted">Чат не сохранился.</p>';return;}$('#cbox',box).innerHTML=rows.map(r=>`<div class="msg"><time>${mmss(r.c.time)}</time><div><span class="${r.p?._rad?'rad':'dire'}">${r.p?esc(hName(r.p.hero_id))+' ('+pName(r.p)+')':'Неизвестный'}:</span> <span class="${r.wheel?'wheel':''}">${esc(r.text)}</span></div></div>`).join('');
    },
  };

  return { html, mount() {
    const box = $('#tabbox');
    const show = k => {
      $$('.tabs button').forEach(b => {
        const active=b.dataset.tab === k;
        b.setAttribute('aria-selected', active);
        if(active) requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}));
      });
      TAB[k](box);
    };
    $$('.tabs button').forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
    show('overview');
    const rq = $('#reqparse');
    if (rq) {
      const send = async () => {
        rq.disabled = true;
        try { await requestParse(m.match_id); rq.textContent = 'Разбор запрошен. Обнови страницу через 1–3 минуты'; }
        catch (e) { rq.textContent = e.message === 'limit' ? 'Лимит запросов, попробуй через минуту' : 'Не удалось отправить запрос'; rq.disabled = false; }
      };
      rq.onclick = send;
      if (m.lobby_type === 7 && !wasRequested(m.match_id)) send();   // рейтинговый матч: запрашиваем сами
      else if (wasRequested(m.match_id)) { rq.textContent = 'Разбор уже запрошен. Обнови страницу позже'; rq.disabled = true; }
    }
  } };
}

/* ========== роутер ========== */
async function route() {
  const my = ++nav;
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  window.scrollTo(0, 0);
  app.innerHTML = '<p class="muted" style="padding:40px 0">Загружаю…</p>';
  try {
    let page;
    if (parts[0] === 'player') page = await playerPage(parts[1]);
    else if (parts[0] === 'match') page = await matchPage(parts[1]);
    else if (parts[0] === 'search') page = await searchPage(decodeURIComponent(parts.slice(1).join('/')));
    else page = homePage();
    if (my !== nav) return;
    app.innerHTML = page.html;
    if (page.mount) page.mount();
  } catch (e) {
    if (my !== nav) return;
    app.innerHTML = `<div class="panel err"><h2>Не получилось загрузить</h2><p>${esc(e.message)}</p><p><a href="#/">На главную</a></p></div>`;
    console.error(e);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
